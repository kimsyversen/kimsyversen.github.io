  <style>

<script>
(() => {
  const root = document.getElementById('devsecops-selected-phase-trace');
  const grid = root.querySelector('.st-grid');
  const map = root.querySelector('.st-map');
  const diagram = root.querySelector('.st-connectors');
  const bridgeLabel = root.querySelector('.st-bridge-label');
  const trace = root.querySelector('.st-trace');
  const detail = root.querySelector('.st-panel-facts');
  const detailName = root.querySelector('[data-st-name]');
  const detailNumber = root.querySelector('[data-st-num]');
  const purpose = root.querySelector('[data-st-purpose]');
  const phases = JSON.parse(document.getElementById('st-phase-data').textContent);
  const transfers = [
    'Approved task spec', 'Pull request', 'Merged code', 'Signed artifact', 'Test results and risk verdict',
    'Approved artifact', 'Running service and deploy record', 'Logs and records'
  ];
  const conditions = { 0: 'If the spec is approved', 2: 'If the merge is approved', 5: 'If production is approved' };
  const namespace = 'http://www.w3.org/2000/svg';
  const copper = 'var(--accent)';
  const sage = 'var(--evidence)';
  const rail = 'var(--connector)';
  let selected = 5;

  function element(tag, name, text) {
    const node = document.createElement(tag);
    if (name) node.className = name;
    if (text) node.textContent = text;
    return node;
  }

  function mark(tag, attributes) {
    const node = document.createElementNS(namespace, tag);
    for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, value);
    diagram.append(node);
    return node;
  }

  function elbow(points, radius = 9) {
    let d = `M ${points[0].join(' ')}`;
    for (let index = 1; index < points.length - 1; index++) {
      const [x, y] = points[index];
      const tangent = ([endX, endY]) => {
        const dx = endX - x;
        const dy = endY - y;
        const fraction = Math.min(.45, radius / (Math.hypot(dx, dy) || 1));
        return `${x + dx * fraction} ${y + dy * fraction}`;
      };
      d += ` L ${tangent(points[index - 1])} Q ${x} ${y} ${tangent(points[index + 1])}`;
    }
    return `${d} L ${points.at(-1).join(' ')}`;
  }

  function route(points, { color = rail, active = false, dash, opacity = 1 } = {}) {
    const end = points.at(-1);
    const previous = points.at(-2);
    const turn = Math.atan2(end[1] - previous[1], end[0] - previous[0]) * 180 / Math.PI;
    const attributes = {
      d: elbow(points), fill: 'none', stroke: color, opacity,
      'stroke-width': active ? 1.9 : 1.13, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
    };
    if (dash) attributes['stroke-dasharray'] = dash;
    mark('path', attributes);
    mark('path', {
      d: 'M -4.8 -3 L 0 0 -4.8 3', fill: 'none', stroke: color, opacity,
      'stroke-width': active ? 1.8 : 1.1, 'stroke-linecap': 'round', 'stroke-linejoin': 'round',
      transform: `translate(${end.join(' ')}) rotate(${turn})`
    });
  }

  function positioned(box) {
    const origin = map.getBoundingClientRect();
    const rect = box.getBoundingClientRect();
    const left = rect.left - origin.left;
    const right = rect.right - origin.left;
    const top = rect.top - origin.top;
    const bottom = rect.bottom - origin.top;
    return { left, right, top, bottom, x: (left + right) / 2, y: (top + bottom) / 2 };
  }

  function draw() {
    diagram.replaceChildren();
    bridgeLabel.hidden = true;
    if (getComputedStyle(diagram).display === 'none') return;
    const boxes = buttons.map(positioned);
    const [plan, , , , test, release, deploy, operate, monitor] = boxes;
    const width = map.clientWidth;
    const height = map.clientHeight;
    const middle = (test.bottom + release.top) / 2;
    diagram.setAttribute('viewBox', `0 0 ${width} ${height}`);

    const focus = boxes[selected];
    if (selected > 0) {
      const toLeft = selected >= 5;
      const start = toLeft ? focus.bottom : focus.top;
      const gutter = toLeft ? height - 8 : 8;
      const spine = toLeft ? 4 : plan.x;
      const branch = [[focus.x, start], [focus.x, gutter], [spine, gutter]];
      branch.push(...(toLeft ? [[spine, plan.y], [plan.left - 2, plan.y]] : [[plan.x, plan.top - 2]]));
      route(branch, { color: selected === 8 ? copper : rail, active: selected === 8, dash: '3.5 4.5', opacity: selected === 8 ? 1 : .8 });
    }

    for (let index = 0; index < transfers.length; index++) {
      const source = boxes[index];
      const destination = boxes[index + 1];
      const active = selected === index || selected === index + 1;
      const color = active ? (index === 5 ? copper : sage) : rail;
      const points = index === 4
        ? [[source.x, source.bottom], [source.x, middle], [destination.x, middle], [destination.x, destination.top - 2]]
        : [[source.right + 2, source.y], [destination.left - 2, destination.y]];
      route(points, { color, active, opacity: active ? 1 : .77 });
    }
    if (selected === 4 || selected === 5) {
      bridgeLabel.hidden = false;
      bridgeLabel.style.left = `${(test.x + release.x) / 2}px`;
      bridgeLabel.style.top = `${middle}px`;
    }
    if (selected === 8) {
      const y = monitor.top - 12;
      route([[monitor.x, monitor.top], [monitor.x, y], [operate.x, y], [operate.x, operate.top - 2]], { color: sage, active: true });
    }
    if (selected === 5 || selected === 6) {
      const x = (release.right + deploy.left) / 2;
      const y = (release.y + deploy.y) / 2;
      mark('path', { d: `M ${x} ${y - 17} l 3.4 3.4 -3.4 3.4 -3.4 -3.4 Z`, fill: copper });
    }
  }

  function createPhase({ name, shortOutput, gate }, index) {
    const item = element('li');
    const control = element('button', 'st-phase');
    control.type = 'button';
    control.setAttribute('aria-pressed', 'false');
    control.setAttribute('aria-controls', 'st-selected-phase');
    control.setAttribute('aria-label', [name, shortOutput, gate ? 'Recommended human gate' : ''].filter(Boolean).join(', '));
    control.append(element('span', 'st-num', String(index + 1).padStart(2, '0')), element('span', 'st-name', name), element('span', 'st-out', shortOutput));
    if (gate) {
      control.dataset.gate = '';
      control.append(element('span', 'st-gate', 'Human gate'));
    }
    control.addEventListener('click', () => select(index, true));
    item.append(control);
    grid.append(item);
    return control;
  }

  function traceRows(index) {
    const phase = phases[index];
    const rows = [];
    if (index === 0) rows.push(['Into Plan', 'New request']);
    else if (index === 9) rows.push(['Into Retire', 'Decision to retire']);
    else rows.push([`${phases[index - 1].name} → ${phase.name}`, transfers[index - 1], conditions[index - 1]]);
    if (phase.gate) rows.push(['Human gate', phase.gate, '[recommendation]', 'gate']);
    if (index === 8) rows.push(['Monitor → Operate', 'Alerts'], ['Monitor → Plan', 'Incident tickets and new issues', '', 'feedback']);
    else if (index === 9) rows.push(['Retire output', 'Closure record', 'After shutdown and data handling']);
    else rows.push([`${phase.name} → ${phases[index + 1].name}`, transfers[index], conditions[index]]);
    if (!phase.gate && index !== 8) rows.push([`${phase.name} → Plan`, 'Planning feedback', 'As needed', 'feedback']);
    return rows;
  }

  function renderTrace(index) {
    trace.replaceChildren(...traceRows(index).map(([label, value, qualifier, kind]) => {
      const item = element('div', 'st-trace-item');
      const term = element('dt', 'st-route-label', label);
      if (kind) term.dataset.kind = kind;
      const description = element('dd', '', value);
      if (qualifier) description.append(element('span', 'st-qualifier', qualifier));
      item.append(term, description);
      return item;
    }));
  }

  function renderDetail(index) {
    const phase = phases[index];
    detailName.textContent = phase.name;
    detailNumber.textContent = String(index + 1).padStart(2, '0');
    purpose.textContent = phase.purpose;
    const risks = element('ul');
    for (const [label, text] of phase.risks) {
      const item = element('li');
      item.append(element('strong', '', label), ` ${text}`);
      risks.append(item);
    }
    const riskDescription = element('dd');
    riskDescription.append(risks);
    detail.replaceChildren(
      element('dt', '', 'Input'), element('dd', '', phase.input),
      element('dt', '', 'Output'), element('dd', '', phase.output),
      element('dt', '', 'Risks [inference]'), riskDescription
    );
  }

  function select(index, save = false) {
    if (index < 0 || index >= phases.length) return;
    if (save && selected === index) return;
    selected = index;
    const near = index === 8 ? [0, 7] : index === 9 ? [] : [index - 1, index + 1].filter((number) => number !== 9);
    buttons.forEach((button, number) => {
      button.setAttribute('aria-pressed', String(number === selected));
      button.toggleAttribute('data-related', near.includes(number));
    });
    renderTrace(selected);
    renderDetail(selected);
    draw();
    if (save) window.openai?.setWidgetState?.({ modelContent: { phase: phases[selected].name }, privateContent: null })?.catch(() => {});
  }

  function applyState(widgetState) {
    const index = phases.findIndex((phase) => phase.name === widgetState?.modelContent?.phase);
    select(index >= 0 ? index : 5);
  }

  const buttons = phases.map(createPhase);
  root.querySelector('[data-st-planning]').addEventListener('click', () => {
    select(0, true);
    buttons[0].focus();
  });
  applyState(window.openai?.widgetState);
  window.addEventListener('openai:set_globals', (event) => applyState(event.detail?.globals?.widgetState));
  new ResizeObserver(draw).observe(map);
  document.fonts.ready.then(draw);
})();
</script>
